<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <title>Croissant Clicker</title>
  <style>
    :root {
      --bg: #fff8ef;
      --card: #ffffff;
      --accent: #d97706;
      --accent-dark: #92400e;
      --text: #3f2a1f;
      --muted: #7c6a5d;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        linear-gradient(120deg,
          #ff595e 0%,
          #ffca3a 16%,
          #8ac926 33%,
          #1982c4 50%,
          #6a4c93 66%,
          #ff7eb6 83%,
          #ff595e 100%);
      background-size: 260% 260%;
      animation: rainbowFlow 22s ease-in-out infinite;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .bg-plate {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      display: grid;
      place-items: center;
      opacity: 0.12;
      overflow: hidden;
    }

    .plate {
      width: min(72vmin, 560px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #fff 0 43%, #f6ede3 44% 54%, #ead7c1 55% 56%, transparent 57%),
        radial-gradient(circle at center, rgba(255, 255, 255, 0.7) 0 24%, transparent 65%);
      box-shadow: 0 18px 48px rgba(70, 40, 20, 0.2);
      position: relative;
      display: grid;
      place-items: center;
    }

    .plate-croissant {
      position: absolute;
      font-size: clamp(24px, 3.2vmin, 38px);
      transform: rotate(var(--rot, 0deg));
      filter: saturate(1.2) drop-shadow(0 4px 2px rgba(50, 30, 15, 0.22));
    }

    .plate-croissant:nth-child(1) { top: 18%; left: 31%; --rot: -20deg; }
    .plate-croissant:nth-child(2) { top: 26%; right: 27%; --rot: 16deg; }
    .plate-croissant:nth-child(3) { top: 44%; left: 18%; --rot: -38deg; }
    .plate-croissant:nth-child(4) { top: 43%; right: 18%; --rot: 35deg; }
    .plate-croissant:nth-child(5) { bottom: 20%; left: 34%; --rot: -10deg; }
    .plate-croissant:nth-child(6) { bottom: 20%; right: 33%; --rot: 12deg; }

    .game {
      width: min(900px, 100%);
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 24px;
      display: grid;
      gap: 20px;
      grid-template-columns: 1.2fr 1fr;
      position: relative;
      z-index: 1;
    }

    .panel {
      border: 1px solid #f3e4cf;
      border-radius: 16px;
      padding: 18px;
      background: #fffcf8;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(26px, 4vw, 38px);
    }

    .stats {
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.6;
    }

    #croissantButton {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 26px 10px;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 700;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      cursor: pointer;
      transition: transform .06s ease, filter .2s ease;
    }

    #croissantButton:hover { filter: brightness(1.05); }
    #croissantButton:active { transform: translateY(2px) scale(0.99); }

    .shop h2 { margin-top: 0; }

    .upgrade {
      width: 100%;
      text-align: left;
      border: 1px solid #ecd7bd;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .upgrade:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .upgrade b { display: block; margin-bottom: 6px; }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .event {
      margin-top: 10px;
      min-height: 24px;
      font-weight: 600;
      color: var(--accent-dark);
    }

    .rain-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 30;
    }

    .rain-timer {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 40;
      background: rgba(20, 20, 20, 0.78);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2px;
      display: none;
    }

    .version {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid #f2e4cf;
      border-radius: 999px;
      padding: 4px 10px;
    }

    .rain-croissant {
      position: absolute;
      top: -40px;
      font-size: 30px;
      animation: fall linear forwards;
      opacity: .95;
      filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.2));
    }

    .click-gain {
      position: fixed;
      color: var(--accent-dark);
      font-weight: 800;
      font-size: clamp(16px, 2vw, 24px);
      pointer-events: none;
      z-index: 60;
      animation: clickGainUp .85s ease-out forwards;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9);
    }

    @keyframes clickGainUp {
      from { opacity: 0; transform: translate(-50%, -20%); }
      20% { opacity: 1; }
      to { opacity: 0; transform: translate(-50%, -165%); }
    }

    @keyframes rainbowFlow {
      0% { background-position: 0% 50%; }
      25% { background-position: 50% 0%; }
      50% { background-position: 100% 50%; }
      75% { background-position: 50% 100%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fall {
      from { transform: translate3d(0, -12vh, 0) rotate(0); }
      to { transform: translate3d(var(--drift, 0px), 115vh, 0) rotate(420deg); }
    }

    @media (max-width: 760px) {
      .game { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-plate" aria-hidden="true">
    <div class="plate">
      <span class="plate-croissant">🥐</span>
      <span class="plate-croissant">🥮</span>
      <span class="plate-croissant">🥐</span>
      <span class="plate-croissant">🧈</span>
      <span class="plate-croissant">🥐</span>
      <span class="plate-croissant">🥯</span>
    </div>
  </div>

  <div class="game">
    <section class="panel">
      <h1>🥐 Croissant Clicker</h1>
      <div class="stats">
        <div><strong>Круассанов:</strong> <span id="count">0</span></div>
        <div><strong>За клик:</strong> <span id="perClick">1</span></div>
        <div><strong>В секунду:</strong> <span id="perSecond">0</span></div>
      </div>
      <button id="croissantButton" aria-label="Испечь круассан">🥐 Испечь круассан</button>
      <p class="hint">Прогресс сохраняется автоматически в браузере.</p>
      <p class="event" id="eventStatus"></p>
    </section>
 
    <aside class="panel shop">
      <h2>Магазин улучшений</h2>
      <button class="upgrade" id="buyOven">
        <b>🔥 Духовка (+1/сек)</b>
        Цена: <span id="ovenPrice">25</span> круассанов | Куплено: <span id="ovenOwned">0</span>
      </button>

      <button class="upgrade" id="buyBakery">
        <b>🏪 Пекарня (+5/сек)</b>
        Цена: <span id="bakeryPrice">120</span> круассанов | Куплено: <span id="bakeryOwned">0</span>
      </button>

      <button class="upgrade" id="buyButter">
        <b>🧈 Масло (+1 за клик)</b>
        Цена: <span id="butterPrice">60</span> круассанов | Куплено: <span id="butterOwned">0</span>
      </button>

      <button class="upgrade" id="buyRestaurant">
        <b>🍽️ Ресторан (+20/сек)</b>
        Цена: <span id="restaurantPrice">480</span> круассанов | Куплено: <span id="restaurantOwned">0</span>
      </button>
    </aside>
  </div>

  <div class="rain-timer" id="rainTimer" aria-live="polite"></div>
  <div class="rain-layer" id="rainLayer" aria-hidden="true"></div>
  <div class="version">Croissant Clicker v1.3.3</div>
  <script src="script.js"></script>
